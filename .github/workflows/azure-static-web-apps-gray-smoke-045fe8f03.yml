name: Azure Static Web Apps CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, release]

jobs:
  build_and_deploy_job:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy frontend preview
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: techito/package-lock.json

      - name: Validate Azure SWA deployment secret
        id: swa-token
        shell: bash
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SMOKE_045FE8F03 }}" ]; then
            echo "::warning::Missing GitHub secret AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SMOKE_045FE8F03. Skipping preview deployment."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate frontend build
        if: steps.swa-token.outputs.available != 'true'
        shell: bash
        working-directory: ./techito
        run: |
          npm ci
          npm run build

      - name: Build and deploy to Azure Static Web Apps
        if: steps.swa-token.outputs.available == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SMOKE_045FE8F03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: './techito'
          api_location: ''
          output_location: 'dist/techito/browser'
          app_build_command: 'npm ci && npm run build'

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request preview
    steps:
      - name: Validate Azure SWA close secret
        id: swa-token
        shell: bash
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SMOKE_045FE8F03 }}" ]; then
            echo "::warning::Missing GitHub secret AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SMOKE_045FE8F03. Skipping preview close."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close preview deployment
        if: steps.swa-token.outputs.available == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SMOKE_045FE8F03 }}
          action: 'close'
          app_location: './techito'
