name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Restore, build and test .NET backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore backend/TechRiders.slnx

      - name: Build solution
        run: dotnet build backend/TechRiders.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/TechRiders.slnx --configuration Release --no-build --logger "console;verbosity=minimal"
