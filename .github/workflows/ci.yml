name: CI General

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: Validate repo scripts and routing
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python scripts
        shell: pwsh
        run: python -m compileall -q .\scripts

      - name: Validate routing evals
        shell: pwsh
        run: py -3 .\scripts\intake\run-routing-evals.py

      - name: Validate security
        shell: pwsh
        run: py -3 .\scripts\intake\validate-security.py

      - name: Validate database routing
        shell: pwsh
        run: py -3 .\scripts\intake\validate-database-routing.py

      - name: Validate RAG routing
        shell: pwsh
        run: py -3 .\scripts\intake\validate-rag-routing.py

      - name: Validate context
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup\validate-context.ps1 -CIMode

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-eval-report
          path: observability/evals/routing-eval-report.json
          if-no-files-found: ignore
          retention-days: 30
