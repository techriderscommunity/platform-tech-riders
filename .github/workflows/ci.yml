name: CI General

on:
  push:
    branches: [main, develop, release]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/agents/**'
      - '.github/instructions/**'
      - '.github/prompts/**'
      - 'boosts/**'
      - 'context/**'
      - 'memory/**'
      - 'observability/**'
      - 'optimization/**'
      - 'orchestrator/**'
      - 'policies/**'
      - 'repo-intake/**'
      - 'repo-registry/**'
      - 'requirements.txt'
      - 'scripts/**'
      - 'specs/**'
  pull_request:
    branches: [main, develop, release]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/agents/**'
      - '.github/instructions/**'
      - '.github/prompts/**'
      - 'boosts/**'
      - 'context/**'
      - 'memory/**'
      - 'observability/**'
      - 'optimization/**'
      - 'orchestrator/**'
      - 'policies/**'
      - 'repo-intake/**'
      - 'repo-registry/**'
      - 'requirements.txt'
      - 'scripts/**'
      - 'specs/**'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-general-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repo scripts and routing
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: py -3 -m pip install -r .\requirements.txt

      - name: Install Graphify CLI
        shell: pwsh
        run: |
          py -3 -m pip install --user uv
          uv tool install graphify
          graphify install --project

      - name: Generate Graphify context index
        shell: pwsh
        run: graphify extract . --no-cluster --out context

      - name: Compile Python scripts
        shell: pwsh
        run: python -m compileall -q .\scripts

      - name: Validate routing evals
        shell: pwsh
        run: py -3 .\scripts\intake\run-routing-evals.py

      - name: Validate security
        shell: pwsh
        run: py -3 .\scripts\intake\validate-security.py

      - name: Validate database routing
        shell: pwsh
        run: py -3 .\scripts\intake\validate-database-routing.py

      - name: Validate RAG routing
        shell: pwsh
        run: py -3 .\scripts\intake\validate-rag-routing.py

      - name: Validate context
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup\validate-context.ps1 -CIMode

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-eval-report
          path: observability/evals/routing-eval-report.json
          if-no-files-found: ignore
          retention-days: 30
