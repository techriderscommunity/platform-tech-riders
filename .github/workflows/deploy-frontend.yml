name: Deploy Frontend

on:
  workflow_run:
    workflows: [Version]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: techito/package-lock.json

      - name: Build frontend
        working-directory: techito
        shell: pwsh
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npm run test:unit:ci
          npm run enforce:shared-ui

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SMOKE_045FE8F03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: techito/dist/techito/browser
          skip_app_build: true
