name: Validate

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\backend\TechRiders.slnx

      - name: Build
        shell: pwsh
        run: dotnet build .\backend\TechRiders.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test .\backend\TechRiders.Tests\TechRiders.Tests.csproj --configuration Release --logger "console;verbosity=minimal"

  frontend:
    name: Frontend
    runs-on: windows-latest

    defaults:
      run:
        working-directory: techito

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: techito/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:unit:ci

      - name: Enforce shared UI
        run: npm run enforce:shared-ui
