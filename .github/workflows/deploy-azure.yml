name: Deploy Azure

on:
  workflow_run:
    workflows: [Version]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-azure-main
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: RG-PlataformaTechRiders
  AZURE_WEBAPP_NAME: apitetxito

jobs:
  deploy:
    name: Deploy backend and frontend
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm ref is integrated with main
        shell: pwsh
        run: |
          git fetch origin main --tags
          $containsMain = git branch --remotes --contains HEAD | Select-String 'origin/main'
          if (-not $containsMain) {
            Write-Error "The deployment ref is not integrated into origin/main."
            exit 1
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: techito/package-lock.json

      - name: Validate backend
        shell: pwsh
        run: |
          dotnet restore .\backend\TechRiders.slnx
          dotnet build .\backend\TechRiders.slnx --configuration Release --no-restore
          dotnet test .\backend\TechRiders.Tests\TechRiders.Tests.csproj --configuration Release --no-build --logger "console;verbosity=minimal"

      - name: Validate frontend
        shell: pwsh
        working-directory: techito
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npm run test:unit:ci
          npm run enforce:shared-ui

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate infrastructure drift
        shell: pwsh
        run: |
          az bicep build --file .\infra\main.bicep --outfile .\infra\main.json
          az bicep build-params --file .\infra\main.dev.bicepparam
          az deployment group what-if `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --template-file .\infra\main.bicep `
            --parameters .\infra\main.dev.bicepparam `
            --result-format ResourceIdOnly

      - name: Publish backend
        shell: pwsh
        run: dotnet publish .\backend\TechRiders.API\TechRiders.Api.csproj --configuration Release --output .\artifacts\backend

      - name: Package backend
        shell: pwsh
        run: Compress-Archive -Path .\artifacts\backend\* -DestinationPath .\artifacts\backend.zip -Force

      - name: Deploy backend App Service
        shell: pwsh
        run: |
          az webapp deploy `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --name $env:AZURE_WEBAPP_NAME `
            --src-path .\artifacts\backend.zip `
            --type zip

      - name: Deploy frontend Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SMOKE_045FE8F03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: techito/dist/techito/browser
          skip_app_build: true

      - name: Smoke backend
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "https://$env:AZURE_WEBAPP_NAME.azurewebsites.net" -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 500) {
            throw "Backend smoke check failed with status $($response.StatusCode)."
          }
