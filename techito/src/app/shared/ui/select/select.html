<label class="ui-select-field">
  @if (label) {
    <span class="ui-select-label" [id]="controlId + '-label'">{{ label }}</span>
  }
  <select
    class="ui-select-input"
    [id]="controlId"
    [name]="name"
    [disabled]="disabled"
    [attr.aria-labelledby]="label ? controlId + '-label' : null"
    [attr.aria-invalid]="invalid"
    [attr.aria-describedby]="describedBy || (errorMessage ? controlId + '-error' : null)"
    [ngModel]="value"
    (ngModelChange)="valueChange.emit($event)"
  >
    @for (option of options; track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
  @if (errorMessage) {
    <span class="ui-select-error" [id]="controlId + '-error'" role="alert">{{ errorMessage }}</span>
  }
</label>
