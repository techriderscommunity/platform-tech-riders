<label class="ui-field">
  <span class="ui-field-label" [id]="controlId + '-label'">{{ label }}</span>
  <input
    [id]="controlId"
    class="ui-field-input"
    [type]="type"
    [name]="name"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
    [required]="required"
    [disabled]="disabled"
    [attr.aria-labelledby]="controlId + '-label'"
    [attr.aria-invalid]="invalid"
    [attr.aria-describedby]="describedBy || (errorMessage ? controlId + '-error' : null)"
    [ngModel]="value"
    (ngModelChange)="valueChange.emit($event)"
  />
  @if (errorMessage) {
    <span class="ui-field-error" [id]="controlId + '-error'" role="alert">{{ errorMessage }}</span>
  }
</label>
