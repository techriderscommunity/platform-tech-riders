<label class="ui-field">
  <span class="ui-field-label">{{ label }}</span>
  <input
    class="ui-field-input"
    [type]="type"
    [name]="name"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
    [required]="required"
    [ngModel]="value"
    (ngModelChange)="valueChange.emit($event)"
  />
</label>
