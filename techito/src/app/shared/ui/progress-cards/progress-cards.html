<section class="ui-progress-grid" role="list" aria-label="Progreso">
  @for (item of items; track item.title) {
    <article class="ui-progress-card" role="listitem">
      <header class="ui-progress-head">
        <h3>{{ item.title }}</h3>
        @if (item.status) {
          <span class="ui-progress-status">{{ item.status }}</span>
        }
      </header>
      @if (item.value) {
        <strong class="ui-progress-value">{{ item.value }}</strong>
      }
      <p>{{ item.detail }}</p>
      <div class="ui-progress-track" aria-hidden="true">
        <div class="ui-progress-fill" [style.width.%]="item.progress"></div>
      </div>
      <div class="ui-progress-meta">
        <span>{{ item.progress }}% listo</span>
        @if (item.ctaLabel && item.ctaLink) {
          <a [routerLink]="item.ctaLink">{{ item.ctaLabel }}</a>
        }
      </div>
    </article>
  }
</section>
