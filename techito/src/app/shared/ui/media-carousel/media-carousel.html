<div
  class="ui-carousel"
  [style.--ui-carousel-card-min]="cardMinWidth"
  [style.--ui-carousel-fixed-cols]="fixedColumnsDesktop"
  role="region"
  [attr.aria-label]="ariaLabel"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut()"
>
  @if (showControls) {
  <button class="ui-carousel-btn ui-carousel-btn-left" type="button" aria-label="Anterior" (click)="prev()">
    &#8592;
  </button>
  }

  <div
    #track
    class="ui-carousel-track"
    [class.ui-carousel-track-single]="items.length <= 1"
    [class.ui-carousel-track-few]="items.length > 1 && items.length < 4"
    [class.ui-carousel-track-fixed]="fixedColumnsDesktop !== null"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    @for (item of items; track item.src + item.title) {
    <article class="ui-carousel-slide" [class.ui-carousel-slide-person]="!!item.subtitle" [class.ui-carousel-slide-clickable]="!!item.link">
      @if (item.link) {
      <a class="ui-carousel-card-link" [routerLink]="item.link" [attr.aria-label]="'Abrir ' + item.title">
        @if (item.kind === 'video') {
        <iframe
          [src]="getSafeVideoUrl(item.src)"
          [title]="item.title"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
        } @else {
        <img [src]="item.src" [alt]="item.alt || item.title" loading="lazy" />
        }

        @if (showCaptions) {
        <figcaption [class.ui-carousel-caption-person]="!!item.subtitle">
          <strong>{{ item.title }}</strong>
          @if (item.subtitle) {
            <span class="ui-carousel-subtitle">{{ item.subtitle }}</span>
          }
        </figcaption>
        }
      </a>
      } @else {
      @if (item.kind === 'video') {
      <iframe
        [src]="getSafeVideoUrl(item.src)"
        [title]="item.title"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
      } @else {
      <img [src]="item.src" [alt]="item.alt || item.title" loading="lazy" />
      }

      @if (showCaptions) {
      <figcaption [class.ui-carousel-caption-person]="!!item.subtitle">
        <strong>{{ item.title }}</strong>
        @if (item.subtitle) {
          <span class="ui-carousel-subtitle">{{ item.subtitle }}</span>
        }
        @if (item.socials && item.socials.length) {
          <span class="ui-carousel-socials" aria-label="Redes sociales">
            @for (social of item.socials; track social.platform) {
              <a [href]="social.href" target="_blank" rel="noopener noreferrer" [attr.aria-label]="social.platform" (click)="$event.stopPropagation()">
                @if (social.platform === 'x') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                }
                @if (social.platform === 'linkedin') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                }
                @if (social.platform === 'github') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
                }
                @if (social.platform === 'instagram') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5a4.25 4.25 0 0 0 4.25-4.25v-8.5a4.25 4.25 0 0 0-4.25-4.25h-8.5zm4.25 3.25a5.25 5.25 0 1 1 0 10.5 5.25 5.25 0 0 1 0-10.5zm0 1.5a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5zm5.38-2.28a1.22 1.22 0 1 1 0 2.44 1.22 1.22 0 0 1 0-2.44z"/></svg>
                }
                @if (social.platform === 'youtube') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                }
              </a>
            }
          </span>
        }
      </figcaption>
      }
      }
    </article>
    }
  </div>

  @if (showControls) {
  <button class="ui-carousel-btn ui-carousel-btn-right" type="button" aria-label="Siguiente" (click)="next()">
    &#8594;
  </button>
  }
</div>
